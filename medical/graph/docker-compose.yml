services:
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Set via graph/.env (see .env.example). Do not hardcode passwords in git.
      - NEO4J_AUTH=${NEO4J_AUTH:?Set NEO4J_AUTH in medical/graph/.env — see .env.example}
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j_data:
