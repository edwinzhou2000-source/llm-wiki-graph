# =====================================================
# adidas Product Knowledge Hub — nginx site config
# 作用: HTTPS 反代 + 限流 + 写操作二次拦截
# 放在: /etc/nginx/sites-available/adidas-hub
# 启用: ln -s /etc/nginx/sites-available/adidas-hub /etc/nginx/sites-enabled/
# =====================================================

# ── 限流定义 ──
# Q&A 端点: 每个 IP 每分钟最多 10 次 (与 server.py QA_RATE_LIMIT 配合)
limit_req_zone $binary_remote_addr zone=qa_limit:10m rate=10r/m;

# 通用: 每个 IP 每秒最多 20 次 (防 DDoS)
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;

# 连接数限制: 每个 IP 最多 10 并发
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name _;  # 替换为你的域名，如 knowledge.adidas-demo.com
    return 301 https://$host$request_uri;
}

# ── HTTPS 主站点 ──
server {
    listen 443 ssl http2;
    server_name _;  # 替换为你的域名

    # SSL 证书 (部署时 certbot 自动填充)
    ssl_certificate     /etc/letsencrypt/live/adidas-hub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/adidas-hub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 允许 D3.js 和 marked.js CDN (知识图谱需要)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://d3js.org https://cdn.jsdelivr.net; connect-src 'self'; img-src 'self' data:;" always;

    client_max_body_size 50m;  # 文件上传 (READ_ONLY 模式下不会触发，但保留容量)

    # ── 全局限流 ──
    limit_req zone=general_limit burst=30 nodelay;
    limit_conn conn_limit 10;

    # ── 禁止直接访问写操作端点 (第二道防线) ──
    # 即使 server.py READ_ONLY 模式出 bug，nginx 也拦截
    location /upload {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/save {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/proposals/approve {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/proposals/reject {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/run-check {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/run-improve {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /api/tasks/run {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }
    location /history/clear {
        return 403 '{"error":"Write operations disabled on public endpoint"}';
    }

    # ── Q&A 端点 — 限流保护 ──
    location /ask {
        limit_req zone=qa_limit burst=2 nodelay;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI 回答可能较慢
        proxy_send_timeout 60s;
        # SSE 流式支持
        proxy_buffering off;
    }
    location /ask-stream {
        limit_req zone=qa_limit burst=2 nodelay;
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        proxy_buffering off;  # 必须关闭 — SSE 流式输出
        chunked_transfer_encoding on;
    }

    # ── API 只读端点 — 不限流，可缓存 ──
    location /api/ {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /status {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── 静态文件 + 前端 ──
    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存 (不影响实时内容)
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
            proxy_pass http://127.0.0.1:8767;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # 日志
    access_log /var/log/nginx/adidas-hub-access.log;
    error_log  /var/log/nginx/adidas-hub-error.log;
}
