  document.getElementById('btn-cancel').style.display='none';
  document.getElementById('btn-save').style.display='none';
  document.getElementById('edit-status').textContent='';
}

async function saveEdit(){
  if(!_editSlug)return;
  const newContent=document.getElementById('edit-area')?.value;
  if(!newContent){document.getElementById('edit-status').textContent='内容为空';return;}
  document.getElementById('edit-status').textContent='保存中...';
  try{
    const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug:_editSlug,content:newContent})});
    const d=await r.json();
    if(d.ok){
      document.getElementById('edit-status').textContent='✅ 已保存 ('+d.backup+')';
      _editOrig=newContent;
      document.getElementById('detail-content').innerHTML=
        '<div class="md-body">'+renderMd(newContent,selectedNode)+'</div>';
      document.getElementById('detail-content').setAttribute('data-raw',newContent);
      document.getElementById('btn-edit').style.display='inline-block';
      document.getElementById('btn-cancel').style.display='none';
      document.getElementById('btn-save').style.display='none';
    }else{
      document.getElementById('edit-status').textContent='❌ '+d.error;
    }
  }catch(e){
    document.getElementById('edit-status').textContent='❌ 网络错误';
  }
}

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ===== REVIEW VIEW (Level 3: one-at-a-time human approval) =====
let _reviewData=null, _reviewIndex=0;

async function refreshReviewData(){
  try{
    const r=await fetch('/api/proposals');
    _reviewData=await r.json();
  }catch(e){_reviewData=[];}
}

async function renderReview(){
  const list=document.getElementById('list-area');
  list.innerHTML='<div class="md-loading">加载提案...</div>';
  await refreshReviewData();
  if(!_reviewData||!_reviewData.length){
    list.innerHTML='<div class="empty">✅ 没有待审核的提案<br><br><small>编译概要和概念链接已由 Level 1 全自动处理。<br>上传文件生成的提案和 AI 改进建议会在此展示，等待人工审核。</small></div>';
    return;
  }
  const pending=_reviewData.filter(p=>p.status==='pending');
  
  // Find the first pending starting from current index
  if(_reviewIndex>=_reviewData.length)_reviewIndex=0;
  while(_reviewIndex<_reviewData.length && _reviewData[_reviewIndex].status!=='pending')
    _reviewIndex++;
  if(_reviewIndex>=_reviewData.length)_reviewIndex=0;
  
  const done=_reviewData.filter(p=>p.status!=='pending');
  const current=pending.length>0?_reviewData[_reviewIndex]:null;
  
  let html='';
  
  // Progress bar
  html+=`<div style="padding:14px 16px;background:#111128;border-bottom:1px solid #1e1e3a;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:14px;font-weight:600;color:#e0e0e0">📋 内容审核</span>
    <span style="font-size:13px;color:#888">⏳ 待审 ${pending.length} 条 · 已处理 ${done.length} 条</span>
  </div>`;
  
  if(!current||pending.length===0){
    html+=`<div style="padding:60px 20px;text-align:center">
      <div style="font-size:48px;margin-bottom:16px">🎉</div>
      <div style="font-size:18px;color:#4ade80;font-weight:600;margin-bottom:8px">全部审核完毕！</div>
      <div style="font-size:13px;color:#666">已处理 ${done.length} 条，其中 ${done.filter(p=>p.status==='approved').length} 条批准。</div>
    </div>`;
  }else{
    // Current proposal number
    const idx=pending.indexOf(current);
    html+=`<div style="padding:10px 16px;font-size:12px;color:#666;background:#0d0d1a;border-bottom:1px solid #1e1e3a">
      第 <strong style="color:#fbbf24">${idx+1}</strong> / ${pending.length} 条待审
    </div>`;
    
    // Fetch full page content for diff rendering (skip for upload/create proposals)
    let fullPage='';
    const isUpload=current.source==='upload';
    const isConcept=current.source==='concept-proposal';
    const isPi=current.source==='pi-ingest';
    const pagePack=Array.isArray(current.pages)?current.pages:[];
    let isCreate=current.action==='create';
    if(isCreate){
      fullPage=''; // new page — no existing content
    }else if(!isUpload && !isConcept && !isPi){
      try{
        const pr=await fetch('/api/page?slug='+encodeURIComponent(current.slug));
        const pd=await pr.json();
        fullPage=pd.content||'';
      }catch(e){}
    }else{
      // Upload / PI — try to fetch existing page
      try{
        const pr=await fetch('/api/page?slug='+encodeURIComponent(current.slug));
        const pd=await pr.json();
        fullPage=pd.content||'';
      }catch(e){}
      // If no existing page found, treat as create (show full proposed content)
      if(!fullPage) isCreate=true;
    }
    
    // Extract improvement type from proposed_content
    const impTypeMatch=(current.proposed_content||'').match(/##\s*改进类型\s*\n([^\n]+)/);
    const impType=impTypeMatch?impTypeMatch[1].trim():'';
    
    // Strip YAML frontmatter to get clean body
    let bodyOnly=fullPage;
    if(fullPage.startsWith('---')){
      const fmClose=fullPage.indexOf('\n---',3);
      if(fmClose>=0) bodyOnly=fullPage.substring(fmClose+4).trimStart();
    }
    
    // Compute diff: find change location in body (not raw page)
    const origFrag=current.original_fragment||'';
    const suggFrag=current.suggested_change||'';
    let before='', after='';
    if(isUpload || isConcept || isPi){
      // Upload / PI proposals: show proposed_content directly
      before=bodyOnly;
      after=(current.proposed_content||'');
      if(after.startsWith('---')){
        const fmClose2=after.indexOf('\n---',3);
        if(fmClose2>=0) after=after.substring(fmClose2+4).trimStart();
      }
    }else if(origFrag&&bodyOnly.indexOf(origFrag)>=0){
      const pos=bodyOnly.indexOf(origFrag);
      before=bodyOnly.substring(0,pos);
      after=bodyOnly.substring(pos+origFrag.length);
    }else{
      // Fallback: show full body as-is
      before=bodyOnly;
    }
    
    // Build inline LCS-based diff: deleted lines appear where removed, added where inserted.
    // Red/green color is sufficient — no +/- prefix needed.
    function computeLineDiff(orig,sugg){
      const ol=orig.split('\n'), sl=sugg.split('\n');
      const lines=[];
      // Compute LCS using DP — O(n*m) but fine for short diffs
      const m=ol.length, n=sl.length;
      const dp=Array.from({length:m+1},()=>new Uint16Array(n+1));
      for(let i=1;i<=m;i++){
        for(let j=1;j<=n;j++){
          if(ol[i-1]===sl[j-1]) dp[i][j]=dp[i-1][j-1]+1;
          else dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]);
        }
      }
      // Walk back to produce inline diff
      const result=[];
      let i=m, j=n;
      while(i>0||j>0){
        if(i>0&&j>0&&ol[i-1]===sl[j-1]){
          // Same line in both → unchanged
          result.unshift({text:ol[i-1],cls:ol[i-1].trim()?'diff-keep':''});
          i--; j--;
        }else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){
          // Line added in new version
          result.unshift({text:sl[j-1],cls:sl[j-1].trim()?'diff-add':''});
          j--;
        }else{
          // Line deleted from old version
          result.unshift({text:ol[i-1],cls:ol[i-1].trim()?'diff-del':''});
          i--;
        }
      }
      return result;
    }
    
    const diffLines=origFrag&&suggFrag?computeLineDiff(origFrag,suggFrag):[];

    // For upload update proposals, compute diff between existing and proposed content
    let uploadDiffLines=[];
    if(isUpload && !isCreate && before && after){
      uploadDiffLines=computeLineDiff(before, after);
    }

    // Render full page as markdown with diff section injected
    let pageHtml='';
    if(isPi && pagePack.length){
      pageHtml+=`<div style="margin:12px 16px;padding:12px;border:1px solid rgba(74,236,196,.25);border-radius:8px;background:rgba(74,236,196,.06)">
        <div style="font-size:12px;color:#4ecdc4;font-weight:600;margin-bottom:8px">📋 说明书提案包 · ${pagePack.length} 页（批准将一并写入）</div>
        <ul style="margin:0;padding-left:18px;font-size:12px;color:#99a;line-height:1.7">
          ${pagePack.map(p=>`<li><code style="color:#e0e0e0">${escapeHtml(p.slug||'')}</code> — ${escapeHtml(p.title||'')}</li>`).join('')}
        </ul>
      </div>`;
    }
    
    // Before part
    if(before){
      pageHtml+='<div class="md-body" style="padding:16px;font-size:13px;line-height:1.8;color:#99a">';
      pageHtml+=typeof marked!=='undefined'&&marked.parse?marked.parse(before):escapeHtml(before).replace(/\\n/g,'<br>');
      pageHtml+='</div>';
    }
    
    // Diff detail section
    if(isUpload && !isCreate && uploadDiffLines.length>0){
      // Upload update: show diff with red/green
      pageHtml+=`<div style="border:1px solid rgba(251,191,36,.2);border-radius:8px;margin:0 16px 8px;overflow:hidden">
        <div style="padding:10px 16px;background:rgba(251,191,36,.12);font-size:12px;color:#fbbf24;font-weight:600">
          ✏️ 更新产品 · ${escapeHtml(current.change_summary||'')}
        </div>
        <div style="padding:8px 12px;background:#0d0d1a;font-family:monospace;font-size:12px;line-height:1.9;max-height:400px;overflow-y:auto">`;
      for(const dl of uploadDiffLines){
        const bg=dl.cls==='diff-add'?'rgba(74,222,128,.1)':dl.cls==='diff-del'?'rgba(248,113,113,.1)':'transparent';
        const fg=dl.cls==='diff-add'?'#4ade80':dl.cls==='diff-del'?'#f87171':'#667';
        pageHtml+=`<div style="background:${bg};padding:1px 6px;color:${fg};font-weight:${dl.cls?'600':'400'}">${escapeHtml(dl.text)}</div>`;
      }
      pageHtml+=`</div></div>`;
    }else if(isUpload && diffLines.length>0){
      pageHtml+=`<div style="border:1px solid rgba(251,191,36,.2);border-radius:8px;margin:0 16px 8px;overflow:hidden">
        <div style="padding:10px 16px;background:rgba(251,191,36,.12);font-size:12px;color:#fbbf24;font-weight:600">
          📤 ${isCreate?'新建产品':'更新产品'} · ${escapeHtml(current.change_summary||'')}
        </div>
      </div>`;
    }else if(impType && diffLines.length>0){
      pageHtml+=`<div style="margin:12px 0;border:2px solid #fbbf24;border-radius:12px;overflow:hidden">
        <div style="padding:10px 16px;background:rgba(251,191,36,.12);font-size:12px;color:#fbbf24;font-weight:600">
          ⚡ 修改区域 · ${escapeHtml(impType)}
        </div>
        <div style="padding:12px 16px;background:#0d0d1a;font-family:monospace;font-size:12px;line-height:1.9;max-height:360px;overflow-y:auto">`;
      for(const dl of diffLines){
        const bg=dl.cls==='diff-add'?'rgba(74,222,128,.1)':dl.cls==='diff-del'?'rgba(248,113,113,.1)':'transparent';
        const fg=dl.cls==='diff-add'?'#4ade80':dl.cls==='diff-del'?'#f87171':'#889';
        pageHtml+=`<div style="background:${bg};padding:2px 6px;border-radius:2px;color:${fg};font-weight:${dl.cls?'600':'400'}">${escapeHtml(dl.text)}</div>`;
      }
      pageHtml+=`</div></div>`;
    }
    
    // After part — skip when upload diff already shows all changes
    if(after && !(isUpload && !isCreate && uploadDiffLines.length>0)){
      // after = proposed new content → bright
      pageHtml+='<div class="md-body" style="padding:16px;font-size:13px;line-height:1.8;color:#c0c0c0">';
      pageHtml+=typeof marked!=='undefined'&&marked.parse?marked.parse(after):escapeHtml(after).replace(/\\n/g,'<br>');
      pageHtml+='</div>';
    }
    
    // Main review card
    const isUploadOrConcept = isUpload || isConcept;
    const badgeText=isUploadOrConcept?(isCreate?'🆕 新建':'✏️ 更新'):(impType||'');
    const badgeColor=isUploadOrConcept?(isCreate?'#4ade80':'#60a5fa'):'#fbbf24';
    const icon=isConcept?'🏷️':(isUpload?'📤':(current.is_entity?'📦':'🏷️'));
    html+=`<div style="margin:16px;background:#111128;border-radius:14px;border:1px solid #1e1e3a;border-left:4px solid #fbbf24;overflow:hidden">
      <div style="padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e1e3a">
        <div>
          <span style="font-weight:700;font-size:17px;color:#e0e0e0">${icon} ${current.title}</span>
          <span style="font-size:12px;color:#555;margin-left:10px">${current.slug}</span>
          <span style="font-size:11px;background:#1a1a3a;padding:2px 8px;border-radius:8px;color:#888;margin-left:8px">${current.category||''}</span>
        </div>
        <span style="font-size:13px;font-weight:700;color:${badgeColor};background:${badgeColor}22;padding:5px 14px;border-radius:8px;border:1px solid ${badgeColor}44;letter-spacing:0.5px">${escapeHtml(badgeText)}</span>
      </div>
      <div style="padding:8px 20px;font-size:11px;color:#fbbf24;background:rgba(251,191,36,.06);border-bottom:1px solid #1e1e3a">
        ⚠️ 完整页面预览：<span style="color:#f87171;font-weight:600">红色 − 删除</span> · <span style="color:#4ade80;font-weight:600">绿色 + 新增</span> · 采纳后自动应用（备份到 _backups/）
      </div>
      <div style="max-height:55vh;overflow-y:auto">
        ${pageHtml}
      </div>
      <div style="padding:16px 20px;display:flex;gap:10px;align-items:center;justify-content:center;border-top:1px solid #1e1e3a">
        <button id="btn-reject-main" onclick="rejectCurrent()" style="padding:10px 28px;border-radius:10px;background:#331111;color:#f87171;border:1px solid #442222;cursor:pointer;font-size:13px;font-weight:600">❌ 驳回</button>
        <button id="btn-approve-main" onclick="approveCurrent()" style="padding:10px 28px;border-radius:10px;background:#0d3320;color:#4ade80;border:1px solid #1a4a2a;cursor:pointer;font-size:13px;font-weight:600">✅ 采纳</button>
        <span id="review-action-status" style="font-size:12px;color:#666;margin-left:8px"></span>
      </div>
    </div>`;
  }
  
  // History section (collapsible)
  if(done.length>0){
    html+=`<div style="margin:0 16px 16px">
      <div onclick="toggleHistory()" style="padding:10px 14px;background:#111128;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:#888">
        <span>📜 审核记录（${done.length} 条）</span>
        <span id="history-arrow" style="font-size:10px">▶</span>
      </div>
      <div id="review-history" style="display:none;margin-top:6px">`;
    
    for(const p of done.slice(-20).reverse()){
      const badge=p.status==='approved'?'✅ 批准':'❌ 驳回';
      const c=p.status==='approved'?'#4ade80':'#f87171';
      html+=`<div style="padding:8px 14px;border-bottom:1px solid #1a1a2a;display:flex;justify-content:space-between;align-items:center;font-size:12px">
        <span style="color:#888">${p.slug}</span>
        <span style="color:${c};font-weight:600">${badge}</span>
      </div>`;
    }
    
    html+=`</div></div>`;
  }
  
  list.innerHTML=html;
  document.getElementById('view-count').textContent=`${pending.length} 条待审`;
}

function toggleHistory(){
  const h=document.getElementById('review-history');
  const a=document.getElementById('history-arrow');
  if(h.style.display==='none'){h.style.display='block';a.textContent='▼';}
  else{h.style.display='none';a.textContent='▶';}
}

async function approveCurrent(){
  if(!_reviewData||_reviewIndex>=_reviewData.length)return;
  const p=_reviewData[_reviewIndex];
  const status=document.getElementById('review-action-status');
  status.textContent='批准中...';status.style.color='#888';
  document.getElementById('btn-approve-main').disabled=true;
  document.getElementById('btn-reject-main').disabled=true;
  try{
    const r=await fetch('/api/proposals/approve',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug:p.slug})});
    const d=await r.json();
    if(d.ok){
      p.status='approved';
      status.textContent='✅ 已批准';status.style.color='#4ade80';
      setTimeout(()=>{_reviewIndex++;renderReview();},600);
    }else{status.textContent='❌ '+d.error;status.style.color='#f87171';}
  }catch(e){status.textContent='❌ 网络错误';status.style.color='#f87171';}
}

async function rejectCurrent(){
  if(!_reviewData||_reviewIndex>=_reviewData.length)return;
  const p=_reviewData[_reviewIndex];
  const status=document.getElementById('review-action-status');
  status.textContent='驳回中...';status.style.color='#888';
  document.getElementById('btn-approve-main').disabled=true;
  document.getElementById('btn-reject-main').disabled=true;
  try{
    const r=await fetch('/api/proposals/reject',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({slug:p.slug})});
    const d=await r.json();
    if(d.ok){
      p.status='rejected';
      status.textContent='❌ 已驳回，加载下一条...';status.style.color='#f87171';
      setTimeout(()=>{_reviewIndex++;renderReview();},600);
    }else{status.textContent='❌ '+d.error;status.style.color='#f87171';}
  }catch(e){status.textContent='❌ 网络错误';status.style.color='#f87171';}
}

async function renderSelfCheck(){
  const list=document.getElementById('list-area');
  list.innerHTML=`<div style="max-width:900px;margin:0 auto" id="tasks-container">
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px">
      <button onclick="runMaintenance()" style="padding:12px 32px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;cursor:pointer;font-size:16px;font-weight:600">🚀 运行全量维护</button>
      <span style="color:#888;font-size:13px">补齐概念 → 自检 → L1填充 → L3审阅 → 重建索引</span>

async function loadTasks(){
  try{const r=await fetch('/api/tasks');const d=await r.json();renderTaskCards(d.tasks);}catch(e){document.getElementById('task-cards').innerHTML='<div style="color:#f87171;text-align:center;padding:60px 0;grid-column:1/-1">❌ 加载失败: '+e.message+'</div>';}
}

function renderTaskCards(tasks){
  const cards=document.getElementById('task-cards');
  cards.innerHTML=tasks.map(t=>{
    const icon=t.last_ok===true?'✅':t.last_ok===false?'❌':'⬜';
    const color=t.last_ok===true?'#4ade80':t.last_ok===false?'#f87171':'#888';
    const timeBadge=t.last_time?`<span style="font-size:11px;color:#888">${t.last_time}</span>`:'';
    return `<div style="background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-weight:600;font-size:15px">${t.name}</span><span style="font-size:20px;color:${color}">${icon}</span></div>
      <div style="font-size:12px;color:#999;margin-bottom:10px">${t.desc}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px">${timeBadge}</div>
      <button onclick="runTask('${t.id}')" style="width:100%;padding:8px;background:#444;color:#ccc;border:1px solid #555;border-radius:6px;cursor:pointer;font-size:13px">▶ 运行</button>
      ${t.last_output?`<pre style="margin-top:8px;background:rgba(0,0,0,.3);padding:8px;border-radius:6px;font-size:10px;line-height:1.4;max-height:120px;overflow:auto;white-space:pre-wrap">${escapeHtml(t.last_output)}</pre>`:''}
    </div>`;
  }).join('');
}

async function runTask(taskId){
  const log=document.getElementById('task-log');
  const names={validate:'全量自检','enrich-l1':'L1 自动填充','enrich-l3':'L3 改进审阅','improve-concepts':'补齐概念页','sync-concepts':'同步概念页',rebuild:'重建索引+同步'};
  log.innerHTML=`<div class="md-loading">⏳ ${names[taskId]||taskId}...</div>`;
  try{
    const r=await fetch('/api/tasks/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:taskId})});
    const d=await r.json();
    if(d.error){log.innerHTML=`<div style="color:#f87171">❌ ${escapeHtml(d.error)}</div>`;return;}
    const result=d.results&&d.results[0];
    if(!result){log.innerHTML=`<div style="color:#f87171">❌ 无返回结果</div>`;return;}
    const ok=result.ok?'✅':'❌';
    log.innerHTML=`<div style="padding:12px;background:rgba(0,0,0,.2);border-radius:8px;border:1px solid rgba(255,255,255,.06)">
      <b style="color:${result.ok?'#4ade80':'#f87171'}">${ok} ${names[taskId]||taskId}</b>
      <pre style="margin-top:8px;background:rgba(0,0,0,.3);padding:8px;border-radius:6px;font-size:11px;line-height:1.5;max-height:200px;overflow:auto;white-space:pre-wrap">${escapeHtml(result.output||'')}</pre>
    </div>`;
    loadTasks();
  }catch(e){log.innerHTML=`<div style="color:#f87171">❌ ${escapeHtml(e.message)}</div>`;}
}

async function runMaintenance(){
  const log=document.getElementById('task-log');
  const flow=['sync-concepts','improve-concepts','validate','enrich-l1','enrich-l3','rebuild'];
  for(const tid of flow){
    await runTask(tid);
  }
  log.innerHTML+='<div style="text-align:center;padding:12px;color:#4ade80;font-weight:600">✅ 全量维护完成。L3 提案请到 <a href="#" onclick="switchView(\'review\');return false" style="color:#667eea">审核页</a> 审批。</div>';
}

async function runSelfCheck(){ await runTask('validate'); }
async function runImprove(){ await runTask('enrich-l3'); }

function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function renderIssues(){
  const list=document.getElementById('list-area');
  list.innerHTML='<div class="md-loading">加载中...</div>';
  try{
    const r=await fetch('/api/issues');
    const text=await r.text();
    list.innerHTML='<div class="md-body" style="padding:16px">'+(typeof marked!=='undefined'&&marked.parse?marked.parse(text):text.replace(/\\n/g,'<br>'))+'</div>';
  }catch(e){
    list.innerHTML='<div class="empty">❌ 检查失败</div>';
  }
}

// ===== WINDOW RESIZE (graph) =====
window.addEventListener('resize',()=>{
  const svg=document.querySelector('#graph-area svg');
  if(svg){svg.setAttribute('width',document.getElementById('graph-area').clientWidth);svg.setAttribute('height',document.getElementById('graph-area').clientHeight);}
});
</script>
